<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf9fd" />
    <meta
      name="description"
      content="Fixed-rate credit, one swap away. Lend, borrow against collateral, or exit early across Morpho Midnight markets. Built on 1inch Aqua and SwapVM."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/Switzer-Regular.otf" as="font" type="font/otf" crossorigin />
    <link rel="preload" href="/fonts/Switzer-Medium.otf" as="font" type="font/otf" crossorigin />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('moonglade-theme');
          const prefersDark =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          const theme =
            stored === 'dark' || stored === 'light' ? stored : prefersDark ? 'dark' : 'light';
          const root = document.documentElement;
          root.dataset.theme = theme;
          root.style.colorScheme = theme;
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#050129' : '#faf9fd');
        } catch {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <title>Moonglade — Fixed-rate credit, one swap away.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
