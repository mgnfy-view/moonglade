[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["dependencies"]
# Midnight is pinned to 0.8.34; SwapVM v1.0.2 is pinned to 0.8.30 in upstream source.
auto_detect_solc = true
# The pinned Midnight source uses Osaka's CLZ opcode.
evm_version = "osaka"
optimizer = true
optimizer_runs = 700
via_ir = true
auto_detect_remappings = false

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = true

[profile.ci.fuzz]
runs = 1000

[rpc_endpoints]
base = "${BASE_RPC_URL}"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true

[dependencies]
forge-std = "1.16.2"
# 0.0.0 is a local snapshot label.
midnight = { version = "0.0.0", git = "https://github.com/morpho-org/midnight.git", rev = "7565b9adb3335c1284a3c2525523cda7c07b9fa7" }
"@openzeppelin-contracts" = "5.4.0"
swap-vm = { version = "1.0.2", git = "https://github.com/1inch/swap-vm.git", rev = "32c687c2b73101fc26549e48fa1ff8a4d73afbac" }
aqua = { version = "0.1.0", git = "https://github.com/1inch/aqua.git", rev = "b51f3b6e3c02fa5208e1429f0f14706b025d9dd6" }
solidity-utils = { version = "6.9.7", git = "https://github.com/1inch/solidity-utils.git", rev = "29043f22422fde454951e9733129cce5d67e6a39" }
prb-math = { version = "4.1.0", git = "https://github.com/PaulRBerg/prb-math.git", rev = "280fc5f77e1b21b9c54013aac51966be33f4a410" }

[soldeer]
# Keep canonical import aliases in remappings.txt.
remappings_generate = true
remappings_location = "txt"
remappings_version = false
recursive_deps = false
